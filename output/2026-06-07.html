html{scroll-behavior:smooth}

@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap');
.wrapper{display:flex;max-width:1400px;margin:0 auto;min-height:100vh}
.sidebar{width:320px;min-width:320px;border-right:1px solid rgba(255,255,255,0.06);padding:40px 28px;position:sticky;top:0;height:100vh;overflow-y:auto}

.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:2px}
.sidebar-brand{margin-bottom:40px}
.sidebar-brand h1{font-family:'Inter',sans-serif;font-size:13px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:#5a5a6e;margin-bottom:8px}
.sidebar-brand .sub{font-family:'Inter',sans-serif;font-size:11px;color:#3d3d52;letter-spacing:1px}
.calendar-nav{margin-bottom:36px}
.calendar-nav h3{font-family:'Inter',sans-serif;font-size:11px;font-weight:500;letter-spacing:2px;color:#5a5a6e;margin-bottom:16px;text-transform:uppercase}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;font-size:12px;font-weight:400;border-radius:4px;cursor:pointer;transition:all .15s;color:#5a5a6e;background:transparent;text-decoration:none}
.cal-day:hover{background:rgba(255,255,255,0.04);color:#a8a8b8}
.cal-day.has-report{color:#c9c9d0;background:rgba(255,255,255,0.04);font-weight:500;border:1px solid rgba(255,255,255,0.06)}
.cal-day.has-report:hover{background:rgba(180,140,100,0.15);border-color:rgba(180,140,100,0.3);color:#e0c8a8}
.cal-day.active{background:rgba(180,140,100,0.2);border-color:rgba(180,140,100,0.4);color:#e0c8a8}
.cal-day.other-month{color:#2a2a3a;pointer-events:none}
.cal-month-label{font-family:'Inter',sans-serif;font-size:13px;font-weight:500;color:#8a8a9a;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.cal-month-label .year{color:#4a4a5e;font-weight:300}
.recent-list h3{font-family:'Inter',sans-serif;font-size:11px;font-weight:500;letter-spacing:2px;color:#5a5a6e;margin-bottom:16px;text-transform:uppercase}

.recent-item:last-child{border-bottom:none}
.recent-item:hover{padding-left:8px}
.recent-item .date{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;color:#b8a898;margin-bottom:4px}
.recent-item .title{font-family:'Noto Serif SC',serif;font-size:14px;color:#c9c9d0;line-height:1.5}
.recent-item:hover .title{color:#e0c8a8}
.recent-item .voice-indicator{display:inline-block;font-size:11px;color:#6a7a6a;margin-top:4px}
.recent-item .voice-indicator::before{content:"♪ "}
.main-content{flex:1;padding:40px 48px 60px;max-width:900px}
.page-header{margin-bottom:48px}
.page-header .breadcrumb{font-family:'Inter',sans-serif;font-size:11px;color:#4a4a5e;letter-spacing:1px;margin-bottom:12px}
.page-header h2{font-family:'Noto Serif SC',serif;font-size:28px;font-weight:700;color:#e8e8f0;margin-bottom:8px}
.page-header .desc{font-size:15px;color:#6a6a7e;line-height:1.6}
.feature-card{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:32px;margin-bottom:24px;transition:all .2s}

.feature-card h3{font-family:'Noto Serif SC',serif;font-size:20px;font-weight:600;color:#e0c8a8;margin-bottom:12px;line-height:1.4}
.feature-card p{font-size:14px;color:#8a8a9a;line-height:1.7;margin-bottom:16px}
.feature-card .actions{display:flex;gap:12px;align-items:center}
.feature-card .actions a{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;color:#b8a898;text-decoration:none;padding:6px 16px;border:1px solid rgba(180,140,100,0.2);border-radius:6px;transition:all .15s}

.report-card:hover{background:rgba(255,255,255,0.02);padding-left:28px}
.report-card:last-child{border-bottom:none}
.report-card .date{font-family:'Inter',sans-serif;font-size:12px;color:#6a6a7e;margin-bottom:4px}
.report-card .title{font-family:'Noto Serif SC',serif;font-size:16px;font-weight:500;color:#c9c9d0;margin-bottom:6px}
.report-card:hover .title{color:#e0c8a8}
.report-card .summary{font-size:13px;color:#6a6a7e;line-height:1.5}

.report-page .report-header h1{font-family:'Noto Serif SC',serif;font-size:28px;font-weight:700;color:#e8e8f0;margin-bottom:8px}
.report-page .report-header .meta{font-family:'Inter',sans-serif;font-size:12px;color:#5a5a6e}

.voice-player .player-info .time{font-family:'Inter',sans-serif;font-size:12px;color:#8a8a9a}

.empty-state p{font-size:14px}
@media(max-width:900px){
  .wrapper{flex-direction:column}
  .sidebar{width:100%;min-width:auto;height:auto;position:static;padding:24px 20px}
  .main-content{padding:24px 20px 40px}
  .calendar-grid{max-width:280px}
}
</style>
</head>

// Detect base path for sub-path deployments (e.g. /daily-report-/)
const BP = (function(){
  var p = window.location.pathname;
  var m = p.match(/^(\/.*\/)\d{4}-\d{2}-\d{2}\.html$/);
  return m ? m[1] : '/';
})();

function getDateFromPath(){
  var m = window.location.pathname.match(/\/(\d{4}-\d{2}-\d{2})\.html$/);
  return m ? m[1] : null;
}
function navigateTo(d){
  if(d){
    window.history.pushState({}, '', BP + d + '.html');
  } else {
    window.history.pushState({}, '', BP);
  }
  render();
}
function fmtCN(s){
  var d = new Date(s+'T00:00:00');
  var w = ['日','一','二','三','四','五','六'];
  return (d.getMonth()+1)+'月'+d.getDate()+'日 周'+w[d.getDay()];
}
function fmtShort(s){
  var d = new Date(s+'T00:00:00');
  return (d.getMonth()+1)+'.'+d.getDate();
}
function fmtTime(t){if(!t||isNaN(t))return'0:00';var m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+(s<10?'0':'')+s;}

// Calendar
function renderCal(cur){
  var n=new Date(),y=n.getFullYear(),m=n.getMonth();
  var fd=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate();
  var rds={};for(var k in REPORTS)rds[k]=1;
  var h='<div class="cal-month-label">'+y+'年'+(m+1)+'月</div><div class="calendar-grid">';
  '日一二三四五六'.split('').forEach(function(d){h+='<div style="font-family:Inter,sans-serif;font-size:10px;color:#3d3d52;text-align:center;">'+d+'</div>'});
  for(var i=0;i<fd;i++)h+='<div class="cal-day other-month"></div>';
  for(var d=1;d<=dim;d++){
    var ds=y+'-'+(m+1+'').padStart(2,'0')+'-'+(d+'').padStart(2,'0');
    var has=rds[ds],isA=ds===cur;
    var cls='cal-day'+(has?' has-report':'')+(isA?' active':'');
    if(has){
      h+='<a href="'+BP+ds+'.html" class="'+cls+'" onclick="event.preventDefault();navigateTo(\''+ds+'\')">'+d+'</a>';
    } else {
      h+='<div class="'+cls+'">'+d+'</div>';
    }
  }
  h+='</div>';
  document.getElementById('calendar').innerHTML=h;
}

// Recent
function renderRecent(cur){
  var s=Object.keys(REPORTS).sort().reverse();
  var h='';
  s.forEach(function(d){
    var r=REPORTS[d];
    h+='<a href="'+BP+d+'.html" class="recent-item" onclick="event.preventDefault();navigateTo(\''+d+'\')">'
      +'<div class="date">'+fmtCN(d)+'</div>'
      +'<div class="title">'+r.title+'</div>'
      +(r.audio_file?'<div class="voice-indicator">语音版</div>':'')
      +'</a>';
  });
  if(!s.length)h='<div style="color:#3d3d52;font-size:13px;">暂无日报</div>';
  document.getElementById('recent-list').innerHTML=h;
}

// Home
function renderHome(){
  var s=Object.keys(REPORTS).sort().reverse();
  var lt=s[0];
  var h='<div class="page-header"><div class="breadcrumb">INDEX</div><h2>AI 日报</h2><div class="desc">每日AI行业动态 · 文字 + 语音版</div></div>';
  if(lt){
    var r=REPORTS[lt];
    h+='<div class="feature-card"><div class="meta">最新 · '+fmtCN(lt)+'</div><h3>'+(r.headline_title||r.title)+'</h3>'
      +'<p>'+(r.headline_body||'').substring(0,120)+((r.headline_body||'').length>120?'……':'')+'</p>'
      +'<div class="actions">'
      +'<a href="'+BP+lt+'.html" onclick="event.preventDefault();navigateTo(\''+lt+'\')">阅读全文</a>'
      +(r.audio_file?'<a href="'+BP+lt+'.html#player" onclick="event.preventDefault();navigateTo(\''+lt+'\')">收听语音</a>':'')
      +'</div></div>';
  }
  h+='<div style="margin-top:32px;">';
  s.forEach(function(d){
    if(lt&&d===lt)return;
    var r=REPORTS[d];
    h+='<a href="'+BP+d+'.html" class="report-card" onclick="event.preventDefault();navigateTo(\''+d+'\')">'
      +'<div class="date">'+fmtCN(d)+'</div><div class="title">'+r.title+'</div>'
      +'<div class="summary">'+(r.headline_title||'')+'</div>'
      +'<div class="tags">'+r.sections.slice(0,3).map(function(s){return '<span>'+s.name+'</span>';}).join('')+'</div>'
      +'</a>';
  });
  h+='</div>';
  if(!s.length)h+='<div class="empty-state"><h3>暂无日报</h3><p>日报正在路上</p></div>';
  return h;
}

// Daily
function renderDaily(ds){
  var r=REPORTS[ds];
  if(!r)return '<div class="empty-state"><h3>日报未找到</h3><p><a href="'+BP+'" class="back-link" onclick="event.preventDefault();navigateTo(null)">返回首页</a></p></div>';
  var h='<a href="'+BP+'" class="back-link" onclick="event.preventDefault();navigateTo(null)">返回首页</a>'
    +'<div class="report-page">'
    +'<div class="report-header"><h1>'+r.title+'</h1><div class="meta">'+fmtCN(ds)+'</div></div>';
  if(r.audio_file){
    h+='<div class="voice-player" id="player">'
      +'<button class="play-btn" onclick="toggleAudio(\''+ds+'\')" id="play-btn-'+ds+'"></button>'
      +'<div class="player-info"><div class="label">语音版</div><div class="time" id="time-'+ds+'">点击播放</div></div>'
      +'<audio id="audio-'+ds+'" src="'+r.audio_file+'" preload="none" onended="onAudioEnd(\''+ds+'\')" ontimeupdate="onTimeUpdate(\''+ds+'\')"></audio>'
      +'</div>';
  }
  h+='<div class="headline-block"><div class="headline-tag">头条</div><h2>'+(r.headline_title||'')+'</h2><p>'+(r.headline_body||'')+'</p>'
    +(r.headline_comment?'<div class="comment">小咪说：'+r.headline_comment+'</div>':'')+'</div>';
  (r.sections||[]).forEach(function(s){
    h+='<div class="section-block"><h3>'+s.name+'</h3><p>'+s.content.replace(/\n/g,'<br>')+'</p></div>';
  });
  if(r.daily_insight)h+='<div class="insight-block"><h3>今日观察</h3><p>'+r.daily_insight+'</p></div>';
  h+='</div>';
  return h;
}

// Audio
var curAudio=null;
function toggleAudio(ds){
  var a=document.getElementById('audio-'+ds),b=document.getElementById('play-btn-'+ds),t=document.getElementById('time-'+ds);
  if(curAudio&&curAudio!==a){curAudio.pause();var pb=document.querySelector('.play-btn.playing');if(pb)pb.classList.remove('playing');}
  if(a.paused){a.play();b.classList.add('playing');curAudio=a;t.textContent=fmtTime(a.currentTime);}
  else{a.pause();b.classList.remove('playing');curAudio=null;}
}
function onAudioEnd(ds){var b=document.getElementById('play-btn-'+ds),t=document.getElementById('time-'+ds);b.classList.remove('playing');t.textContent='播放结束';curAudio=null;}
function onTimeUpdate(ds){var t=document.getElementById('time-'+ds),a=document.getElementById('audio-'+ds);t.textContent=fmtTime(a.currentTime)+' / '+fmtTime(a.duration||0);}
function render(){var d=getDateFromPath();renderCal(d);renderRecent(d);document.getElementById('main-content').innerHTML=(d?renderDaily(d):renderHome());}
window.addEventListener('popstate',render);render();
</script>
